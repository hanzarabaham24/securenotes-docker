# SecureNotes — api + Postgres db

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://secure:securepass@db:5432/securenotes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: secure
      POSTGRES_PASSWORD: securepass
      POSTGRES_DB: securenotes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure -d securenotes"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
